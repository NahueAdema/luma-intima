backend:
  name: github
  repo: nahuel/luma-intima
  branch: main
  identity_url: /.netlify/identity
  gateway_url: /.netlify/git/github

local_backend: true

media_folder: "public/imagenes"
public_folder: "/imagenes"

collections:
  - name: "productos"
    label: "Productos"
    folder: "src/content/productos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "titulo", widget: "string", required: true }
      - { label: "Precio", name: "precio", widget: "number", value_type: "int", required: true }
      - { label: "Precio anterior (opcional)", name: "precioAnterior", widget: "number", value_type: "int", required: false }
      - { label: "Descripción", name: "descripcion", widget: "text", required: false }
      - label: "Categoría"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Conjuntos", value: "conjuntos" }
          - { label: "Bombachas", value: "bombachas" }
          - { label: "Bodys", value: "bodys" }
          - { label: "Ropa deportiva", value: "ropa-deportiva" }
          - { label: "Sexshop", value: "sexshop" }
          - { label: "Medias", value: "medias" }
          - { label: "Boxers", value: "boxers" }
          - { label: "Promociones", value: "promociones" }
        required: true
      - label: "Talles disponibles"
        name: "talles"
        widget: "list"
        field: { label: "Talle", name: "talle", widget: "string" }
        default: []
      - label: "Colores disponibles"
        name: "colores"
        widget: "list"
        field: { label: "Color", name: "color", widget: "string" }
        default: []
      - label: "Imágenes del producto"
        name: "imagenes"
        widget: "list"
        field: { label: "URL de imagen", name: "imagen", widget: "string" }
        default: []
      - { label: "Producto destacado", name: "destacado", widget: "boolean", default: false }
      - { label: "Producto nuevo", name: "nuevo", widget: "boolean", default: false }
      - { label: "En stock", name: "enStock", widget: "boolean", default: true }
      - { label: "Material", name: "material", widget: "string", required: false }
      - { label: "Instrucciones de cuidado", name: "cuidados", widget: "text", required: false }
      - { label: "Fecha de carga", name: "fecha", widget: "datetime", required: false }
